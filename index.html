<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Роман Баганцов | Портфолио веб-разработчика</title>
    <meta name="description" content="Портфолио веб-разработчика Романа Баганцова. Современные сайты и веб-приложения.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

<body>

    <header class="header">

            <div class="logo">
                <span class="logo__mark">//</span>
                <span class="logo__text">romabagantsov</span>

                <a href="#" class="nav__link" data-page="about">ОБО МНЕ</a>

        </div>
    </header>

    <main class="main">

            <div class="loader" id="loader">
                <div class="loader__spinner"></div>
            </div>
            <div id="dynamicContent"></div>
        </div>

    <footer class="footer">
        <div class="container footer__container">
            <p>© 2026 Роман Баганцов — Веб-разработчик</p>
